name: Watch Upstream Updates

on:
  schedule:
    - cron: '0 */24 * * *' 
  workflow_dispatch:

jobs:
  discover-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    outputs:
      triggered: ${{ steps.trigger.outputs.triggered }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_TRIGGER_PAT }} 

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Discover updates
        id: discover
        run: |
          STATE_FILE=".github/workflows/state/upstream_commits.json"
          
          mkdir -p "$(dirname "$STATE_FILE")"
          if [ ! -f "$STATE_FILE" ]; then
            echo "{}" > "$STATE_FILE"
            echo "--- Created new state file: $STATE_FILE ---"
          fi

          SUKISU_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
          SUKISU_BRANCH="builtin"
          echo "--- Fetching latest commit from SukiSU-Ultra (branch: $SUKISU_BRANCH) ---"
          SUKISU_LATEST=$(git ls-remote "$SUKISU_URL" "$SUKISU_BRANCH" | cut -f1)
          SUKISU_KNOWN=$(jq -r '.sukisuultra // empty' "$STATE_FILE")

          RESUKISU_URL="https://github.com/ReSukiSU/ReSukiSU.git"
          RESUKISU_BRANCH="main"
          echo "--- Fetching latest commit from ReSukiSU (branch: $RESUKISU_BRANCH) ---"
          RESUKISU_LATEST=$(git ls-remote "$RESUKISU_URL" "$RESUKISU_BRANCH" | cut -f1)
          RESUKISU_KNOWN=$(jq -r '.resukisu // empty' "$STATE_FILE")

          echo "SukiSU-Ultra - Latest: $SUKISU_LATEST, Known: ${SUKISU_KNOWN:-None}"
          echo "ReSukiSU     - Latest: $RESUKISU_LATEST, Known: ${RESUKISU_KNOWN:-None}"

          if [ -z "$SUKISU_LATEST" ] || [ -z "$RESUKISU_LATEST" ]; then
            echo "--- Failed to get latest commit from upstreams. Exiting. ---"
            exit 1
          fi

          NEW_UPDATES=false
          COMMIT_MSG="chore: Update upstreams"

          if [ "$SUKISU_LATEST" != "$SUKISU_KNOWN" ]; then
            echo "--- New SukiSU-Ultra commit found. ---"
            NEW_UPDATES=true
            COMMIT_MSG="$COMMIT_MSG (SukiSU-Ultra: ${SUKISU_LATEST:0:7})"
          fi

          if [ "$RESUKISU_LATEST" != "$RESUKISU_KNOWN" ]; then
            echo "--- New ReSukiSU commit found. ---"
            NEW_UPDATES=true
            COMMIT_MSG="$COMMIT_MSG (ReSukiSU: ${RESUKISU_LATEST:0:7})"
          fi

          if [ "$NEW_UPDATES" = true ]; then
            echo "new_commit_found=true" >> $GITHUB_OUTPUT
            echo "sukisu_latest=$SUKISU_LATEST" >> $GITHUB_OUTPUT
            echo "resukisu_latest=$RESUKISU_LATEST" >> $GITHUB_OUTPUT
            echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          else
            echo "--- All upstreams are up to date. Nothing to do. ---"
            echo "new_commit_found=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Update commit file and Push
        id: update_commit
        if: steps.discover.outputs.new_commit_found == 'true'
        run: |
          STATE_FILE=".github/workflows/state/upstream_commits.json"
          SUKISU_LATEST=${{ steps.discover.outputs.sukisu_latest }}
          RESUKISU_LATEST=${{ steps.discover.outputs.resukisu_latest }}
          COMMIT_MSG="${{ steps.discover.outputs.commit_msg }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "--- Synchronizing with remote repository... ---"
          git pull --rebase
          
          mkdir -p "$(dirname "$STATE_FILE")"
          if [ ! -f "$STATE_FILE" ]; then
            echo "{}" > "$STATE_FILE"
          fi
          
          echo "--- Updating $STATE_FILE with new hashes ---"
          jq --arg S_COMMIT "$SUKISU_LATEST" \
             --arg R_COMMIT "$RESUKISU_LATEST" \
             '.sukisuultra = $S_COMMIT | .resukisu = $R_COMMIT' \
             "$STATE_FILE" > tmp.json && mv tmp.json "$STATE_FILE"
          
          git add "$STATE_FILE"
          git commit -m "$COMMIT_MSG"
          echo "--- Pushing updated commit file... ---"
          git push
          
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Trigger build workflow
        id: trigger
        if: steps.update_commit.outputs.pushed == 'true'
        run: |
          echo "--- Triggering build workflow (build.yml) ---"
          response_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.WORKFLOW_TRIGGER_PAT }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
            --data '{"ref":"${{ github.ref_name }}"}')
          
          if [ "$response_code" -eq 204 ]; then
            echo "--- Build workflow triggered successfully. ---"
            echo "triggered=true" >> $GITHUB_OUTPUT
          else
            echo "--- Failed to trigger build workflow. API responded with code: $response_code ---"
            echo "triggered=false" >> $GITHUB_OUTPUT
            exit 1
          fi
