name: Watch SukiSU-Ultra

on:
  schedule:
    - cron: '0 */24 * * *' 
  workflow_dispatch:

jobs:
  discover-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    outputs:
      new_commit_found: ${{ steps.discover.outputs.new_commit_found }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Discover updates
        id: discover
        run: |
          UPSTREAM_REPO_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
          UPSTREAM_BRANCH="main"
          
          LATEST_COMMIT=$(git ls-remote "$UPSTREAM_REPO_URL" "$UPSTREAM_BRANCH" | cut -f1)
          LAST_KNOWN_COMMIT=$(jq -r '.sukisuultra' sukisu_commits.json)

          if [ "$LATEST_COMMIT" != "$LAST_KNOWN_COMMIT" ]; then
            echo "--- SukiSU-Ultra has new updates. ---"
            echo "old_commit=$LAST_KNOWN_COMMIT"
            echo "new_commit=$LATEST_COMMIT"
            echo "new_commit_found=true" >> $GITHUB_OUTPUT
            echo "$LATEST_COMMIT" > latest-commit.txt
          else
            echo "--- No updates found. ---"
            echo "new_commit_found=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Trigger build workflow
        if: steps.discover.outputs.new_commit_found == 'true'
        run: |
          COMMIT_HASH=$(cat latest-commit.txt)
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
            --data '{"ref":"${{ github.ref }}", "inputs":{}}'
            
      - name: Update commit file
        if: steps.discover.outputs.new_commit_found == 'true'
        run: |
          echo "Updating sukisu_commits.json with new hash..."
          jq --arg LCOMMIT "$LATEST_COMMIT" '.sukisuultra = $LCOMMIT' sukisu_commits.json > tmp.json && mv tmp.json sukisu_commits.json
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sukisu_commits.json
          git commit -m "chore: Update SukiSU-Ultra commit to ${LATEST_COMMIT:0:7}"
          git push
