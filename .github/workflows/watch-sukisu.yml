name: Watch SukiSU-Ultra Updates

on:
  schedule:
    - cron: '0 */24 * * *' 
  workflow_dispatch:

jobs:
  discover-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    outputs:
      triggered: ${{ steps.trigger.outputs.triggered }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_TRIGGER_PAT }} 

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Discover updates
        id: discover
        run: |
          STATE_FILE=".github/workflows/state/sukisu_commits.json"

          UPSTREAM_REPO_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
          UPSTREAM_BRANCH="builtin"
          
          echo "--- Fetching latest commit from SukiSU-Ultra (branch: $UPSTREAM_BRANCH) ---"
          LATEST_COMMIT=$(git ls-remote "$UPSTREAM_REPO_URL" "$UPSTREAM_BRANCH" | cut -f1)
          LAST_KNOWN_COMMIT=$(jq -r '.sukisuultra' "$STATE_FILE")

          echo "Latest upstream commit: $LATEST_COMMIT"
          echo "Last known commit:      $LAST_KNOWN_COMMIT"

          if [ -z "$LATEST_COMMIT" ]; then
            echo "--- Failed to get latest commit from upstream. Exiting. ---"
            exit 1
          fi

          if [ "$LATEST_COMMIT" != "$LAST_KNOWN_COMMIT" ]; then
            echo "--- New SukiSU-Ultra commit found. Proceeding to update. ---"
            echo "new_commit_found=true" >> $GITHUB_OUTPUT
            echo "latest_commit=$LATEST_COMMIT" >> $GITHUB_OUTPUT
          else
            echo "--- SukiSU-Ultra is up to date. Nothing to do. ---"
            echo "new_commit_found=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Update commit file and Push
        id: update_commit
        if: steps.discover.outputs.new_commit_found == 'true'
        run: |
          STATE_FILE=".github/workflows/state/sukisu_commits.json"
          LATEST_COMMIT=${{ steps.discover.outputs.latest_commit }}
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          
          echo "--- Synchronizing with remote repository... ---"
          git pull --rebase
          
          echo "--- Updating $STATE_FILE with new hash: $LATEST_COMMIT ---"
          jq --arg LCOMMIT "$LATEST_COMMIT" '.sukisuultra = $LCOMMIT' "$STATE_FILE" > tmp.json && mv tmp.json "$STATE_FILE"
          
          git add "$STATE_FILE"
          git commit -m "chore: Update SukiSU-Ultra commit to ${LATEST_COMMIT:0:7}"
          echo "--- Pushing updated commit file... ---"
          git push
          
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Trigger build workflow
        id: trigger
        if: steps.update_commit.outputs.pushed == 'true'
        run: |
          echo "--- Triggering build workflow (build.yml) ---"
          response_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.WORKFLOW_TRIGGER_PAT }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
            --data '{"ref":"${{ github.ref_name }}"}')
          
          if [ "$response_code" -eq 204 ]; then
            echo "--- Build workflow triggered successfully. ---"
            echo "triggered=true" >> $GITHUB_OUTPUT
          else
            echo "--- Failed to trigger build workflow. API responded with code: $response_code ---"
            echo "triggered=false" >> $GITHUB_OUTPUT
            exit 1
          fi
