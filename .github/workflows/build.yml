name: Android Kernel Build and Release

on:
  workflow_dispatch:
    inputs:
       create_release:
        description: '是否创建并上传 Release'
        required: false
        default: false
        type: boolean
       is_pre_release:
        description: '是否标记为预发布版本'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libncurses5-dev bc bison flex libssl-dev p7zip-full lz4 cpio curl libelf-dev dwarves ccache jq lld

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v3
        with:
          path: prebuilts
          key: ${{ runner.os }}-toolchain-${{ hashFiles('toolchain.version') }}
          restore-keys: |
            ${{ runner.os }}-toolchain-

      - name: Download and extract toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          PART1_URL="https://github.com/Voisterouslife/android_kernel_samsung_sm8650/releases/download/toolchain/toolchain.tar.gz.00"
          PART2_URL="https://github.com/Voisterouslife/android_kernel_samsung_sm8650/releases/download/toolchain/toolchain.tar.gz.01"
          
          echo "--- 正在从 Release 下载编译链分卷 ---"
          wget $PART1_URL
          wget $PART2_URL
          
          cat toolchain.tar.gz.00 toolchain.tar.gz.01 > toolchain.tar.gz
          tar -xzf toolchain.tar.gz
          
          echo "--- 编译链已解压到 prebuilts/ ---"

      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=~/.ccache
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=10G
          ccache -M 10G
          ccache -s

      - name: Download and install SukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          
      - name: Run kernel build script
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Get uploaded file path from script output
        id: get_file_path
        if: ${{ github.event.inputs.create_release == 'true' }}
        run: |
          UPLOAD_FILE_LINE=$(grep "UPLOAD_FILES" build.sh | tail -1)
          echo "file_path=${UPLOAD_FILE_LINE#*=}" >> $GITHUB_OUTPUT
          echo "已获取文件路径: ${{ steps.get_file_path.outputs.file_path }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S24-Kernel-Zip
          path: |
            out/*.zip
            out/*.img
   
      - name: Create Release
        id: create_release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: S24U_SukiSUUltra_Build_${{ github.run_number }}
          release_name: 'S24U SukiSUUltra Release (Build ${{ github.run_number }})'
          body: |
            A new kernel release for S24U is available!
            - Built from: ${{ github.event.inputs.ref }}
            - Build number: ${{ github.run_number }}
          prerelease: ${{ github.event.inputs.is_pre_release }}

      - name: Upload Release Asset
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.get_file_path.outputs.file_path }}
          asset_name: ${{ github.ref }}.zip
          asset_content_type: application/zip
