name: Android Kernel Build and Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否创建并上传 Release'
        required: false
        default: false
        type: boolean
      is_pre_release:
        description: '是否标记为预发布版本'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    strategy:
      fail-fast: false 
      matrix:
        include:
          - branch: "main"
            name: "Original"
            enable_sukisu: "false"
          
          - branch: "SukiSUUltra" 
            name: "SukiSU"
            enable_sukisu: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }} 
          fetch-depth: 1

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libncurses5-dev bc bison flex libssl-dev p7zip-full lz4 cpio curl libelf-dev dwarves ccache jq lld patch

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v3
        with:
          path: prebuilts
          key: ${{ runner.os }}-toolchain-${{ hashFiles('toolchain.version') }}
          restore-keys: |
            ${{ runner.os }}-toolchain-

      - name: Download and extract toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          PART1_URL="https://github.com/Voisterouslife/android_kernel_samsung_sm8650/releases/download/toolchain/toolchain.tar.gz.00"
          PART2_URL="https://github.com/Voisterouslife/android_kernel_samsung_sm8650/releases/download/toolchain/toolchain.tar.gz.01"
          wget $PART1_URL
          wget $PART2_URL
          cat toolchain.tar.gz.00 toolchain.tar.gz.01 > toolchain.tar.gz
          tar -xzf toolchain.tar.gz
          rm -f toolchain.tar.gz.00 toolchain.tar.gz.01 toolchain.tar.gz
          echo "--- 编译链已解压到 prebuilts/ ---"

      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-ccache-refs/heads/${{ github.event.repository.default_branch }}

      - name: Configure ccache
        run: |
          export CCACHE_DIR=~/.ccache
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=15G
          ccache -M 15G
          ccache -z 

      - name: Download and install SukiSU
        if: matrix.enable_sukisu == 'true'
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main

      - name: Run Baseband-guard setup script
        run: |
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

      - name: Run kernel build script
        env:
          ENABLE_SUKISU: ${{ matrix.enable_sukisu }}
        run: |
          SCRIPT_PATH=".github/workflows/state/build.sh"
          chmod +x "$SCRIPT_PATH"
          "$SCRIPT_PATH"

      - name: Show ccache stats
        run: |
          echo "--- Ccache 统计信息 ---"
          ccache -s

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S24-Kernel-${{ matrix.name }}-Artifacts
          path: |
            out/*.zip
            out/*.img

      - name: Get uploaded file paths
        id: get_file_paths
        if: ${{ github.event.inputs.create_release == 'true' }}
        run: |
          ZIP_FILE=$(find out/ -maxdepth 1 -name "*.zip" | head -n 1)
          IMG_FILE=$(find out/ -maxdepth 1 -name "*.img" | head -n 1)
          
          echo "zip_path=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "img_path=$IMG_FILE" >> $GITHUB_OUTPUT
          echo "已获取 ZIP 文件路径: $ZIP_FILE"
          echo "已获取 IMG 文件路径: $IMG_FILE"

      - name: Create and Upload Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.get_file_paths.outputs.zip_path }}
            ${{ steps.get_file_paths.outputs.img_path }}
          tag_name: S24U_${{ matrix.name }}_Build_${{ github.run_number }}
          name: 'S24U ${{ matrix.name }} Release (Build ${{ github.run_number }})'
          body: |
            Branch: ${{ matrix.branch }}
            - Build number: ${{ github.run_number }}
            - BBG Support
            ${{ matrix.enable_sukisu == 'true' && '- KPM Enable (SukiSU)' || '- Original Kernel' }}
          prerelease: ${{ github.event.inputs.is_pre_release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}