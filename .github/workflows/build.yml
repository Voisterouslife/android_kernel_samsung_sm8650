name: Android Kernel Build and Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否创建并上传 Release'
        required: false
        default: false
        type: boolean
      is_pre_release:
        description: '是否标记为预发布版本'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    strategy:
      fail-fast: false 
      matrix:
        include:
          - branch: "main"
            name: "Original"
            enable_sukisu: "false"
            enable_resukisu: "false"
          
          - branch: "SukiSUUltra" 
            name: "SukiSU"
            enable_sukisu: "true"
            enable_resukisu: "false"

          - branch: "ReSukiSU" 
            name: "ReSukiSU"
            enable_sukisu: "false"
            enable_resukisu: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }} 
          fetch-depth: 1

      - name: Fetch build script from main
        run: |
          echo "--- 正在从 main 分支单独获取 build.sh ---"
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/state/build.sh

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libncurses5-dev bc bison flex libssl-dev p7zip-full lz4 cpio curl libelf-dev dwarves ccache jq lld patch

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v3
        with:
          path: prebuilts
          key: ${{ runner.os }}-toolchain-${{ hashFiles('toolchain.version') }}
          restore-keys: |
            ${{ runner.os }}-toolchain-

      - name: Download and extract toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          PART1_URL="https://github.com/Voisterouslife/android_kernel_samsung_sm8650/releases/download/toolchain/toolchain.tar.gz.00"
          PART2_URL="https://github.com/Voisterouslife/android_kernel_samsung_sm8650/releases/download/toolchain/toolchain.tar.gz.01"
          wget $PART1_URL
          wget $PART2_URL
          cat toolchain.tar.gz.00 toolchain.tar.gz.01 > toolchain.tar.gz
          tar -xzf toolchain.tar.gz
          rm -f toolchain.tar.gz.00 toolchain.tar.gz.01 toolchain.tar.gz
          echo "--- 编译链已解压到 prebuilts/ ---"

      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-ccache-refs/heads/${{ github.event.repository.default_branch }}

      - name: Configure ccache
        run: |
          export CCACHE_DIR=~/.ccache
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=15G
          ccache -M 15G
          ccache -z 

      - name: Download and install SukiSU
        if: matrix.enable_sukisu == 'true'
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Download and install ReSukiSU
        if: matrix.enable_resukisu == 'true'
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main

      - name: Run Baseband-guard setup script
        run: |
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

      - name: Run kernel build script
        env:
          ENABLE_SUKISU: ${{ matrix.enable_sukisu }}
          ENABLE_RESUKISU: ${{ matrix.enable_resukisu }}
        run: |
          SCRIPT_PATH=".github/workflows/state/build.sh"
          chmod +x "$SCRIPT_PATH"
          "$SCRIPT_PATH"

      - name: Show ccache stats
        run: |
          echo "--- Ccache 统计信息 ---"
          ccache -s

      - name: Rename Output Files
        run: |
          echo "--- 正在重命名输出文件 ---"
          cd out/
          for file in *.zip *.img; do
            if [ -f "$file" ]; then
              mv "$file" "【${{ matrix.name }}】$file"
              echo "已重命名: $file -> 【${{ matrix.name }}】$file"
            fi
          done

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S24-Kernel-${{ matrix.name }}-Artifacts
          path: |
            out/*.zip
            out/*.img

  release:
    needs: build
    if: ${{ github.event.inputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: S24-Kernel-*-Artifacts
          merge-multiple: true
          path: release-files/

      - name: Display downloaded files
        run: |
          echo "--- 准备打包上传的文件列表 ---"
          ls -la release-files/

      - name: Create and Upload Unified Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*
          tag_name: S24U_Unified_Build_${{ github.run_number }}
          name: 'S24U Kernel Unified Release (Build ${{ github.run_number }})'
          body: |
            ### 🚀 S24U Kernel Build #${{ github.run_number }}
            
            本 Release 包含以下多个版本的内核镜像及刷机包，请根据文件前缀按需下载：
            - **【Original】**: 原版内核
            - **【SukiSU】**: 集成 SukiSU (KPM Enabled)
            - **【ReSukiSU】**: 集成 ReSukiSU (KPM Disabled)
            
            *默认均已集成 Baseband-guard 支持。*
          prerelease: ${{ github.event.inputs.is_pre_release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
